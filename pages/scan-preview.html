<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Scan Preview & Crop — StudyGen AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <style>
    .preview-container {
      position: relative;
      width: 100%;
      height: 380px;
      background: #1e1e2d;
      border-radius: var(--r-lg);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
      margin-bottom: var(--sp-lg);
      padding: 12px;
    }

    .scanned-img-sim {
      width: 82%;
      height: 88%;
      background: #ffffff;
      border-radius: 4px;
      padding: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      transition: filter 0.3s ease, transform 0.3s ease;
    }

    /* Filter simulation classes */
    .filter-magic { filter: contrast(1.25) brightness(1.05) saturate(1.1); }
    .filter-color { filter: saturate(1.4); }
    .filter-bw    { filter: grayscale(1) contrast(1.5); }

    /* Page Navigation Arrow Buttons */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      z-index: 20;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .nav-arrow-left { left: 8px; }
    .nav-arrow-right { right: 8px; }
    .nav-arrow:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Page Badge Overlay */
    .page-badge-overlay {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(8px);
      color: white;
      padding: 4px 14px;
      border-radius: var(--r-full);
      font-size: 12px;
      font-weight: 600;
      z-index: 15;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: var(--sp-md);
    }
    .slider-row input[type="range"] {
      flex: 1;
      accent-color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="screen screen--with-bar" style="padding-bottom:100px;">
    
    <!-- Top App Bar -->
    <header class="app-bar">
      <button class="app-bar__back" onclick="history.back()" aria-label="Back">
        <span class="material-icons-round">arrow_back_ios_new</span>
      </button>
      <span class="app-bar__center">Scan Preview</span>
      <div class="app-bar__actions">
        <button class="app-bar__action-btn" id="saveDoneBtn" title="Save preview">
          <span class="material-icons-round" style="color:var(--primary)">check</span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="page-scroll page-scroll--no-nav">
      
      <!-- Image Preview Window -->
      <div class="preview-container">
        <div class="page-badge-overlay" id="pageBadge">Page 1 of 1</div>

        <!-- Carousel Left & Right Arrow Controls -->
        <button class="nav-arrow nav-arrow-left" id="prevPageBtn" aria-label="Previous Page">
          <span class="material-icons-round">chevron_left</span>
        </button>
        <button class="nav-arrow nav-arrow-right" id="nextPageBtn" aria-label="Next Page">
          <span class="material-icons-round">chevron_right</span>
        </button>

        <!-- Real Captured Camera Photo Image -->
        <img id="realCapturedImage" class="filter-magic" alt="Captured Document Preview" style="max-width:90%;max-height:90%;object-fit:contain;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,0.5);display:none;position:relative;z-index:5;" />

        <!-- Fallback Simulated Document Content -->
        <div class="scanned-img-sim filter-magic" id="scannedImageSim">
          <div style="font-size:14px;font-weight:700;color:#1e293b;border-bottom:2px solid #e2e8f0;padding-bottom:6px;">
            SCANNED DOCUMENT
          </div>
          <div style="height:6px;background:#94a3b8;border-radius:3px;width:95%"></div>
          <div style="height:6px;background:#cbd5e1;border-radius:3px;width:88%"></div>
          <div style="height:6px;background:#cbd5e1;border-radius:3px;width:92%"></div>
          <div style="display:flex;gap:8px;margin:8px 0;">
            <div style="flex:1;height:50px;background:#e2e8f0;border-radius:4px;border:1px dashed #94a3b8;display:flex;align-items:center;justify-center;font-size:10px;color:#64748b;text-align:center;padding:4px;">Diagram View</div>
            <div style="flex:1;height:50px;background:#e2e8f0;border-radius:4px;border:1px dashed #94a3b8;display:flex;align-items:center;justify-center;font-size:10px;color:#64748b;text-align:center;padding:4px;">Chart View</div>
          </div>
          <div style="height:6px;background:#cbd5e1;border-radius:3px;width:90%"></div>
          <div style="height:6px;background:#cbd5e1;border-radius:3px;width:75%"></div>
        </div>
      </div>

      <!-- Filter Selection Chips -->
      <section class="mb-lg">
        <div class="text-label-md text-secondary mb-sm">Enhancement Filter</div>
        <div class="filter-row">
          <span class="chip" data-filter="original">Original</span>
          <span class="chip active" data-filter="magic">Magic Enhance</span>
          <span class="chip" data-filter="color">Color</span>
          <span class="chip" data-filter="bw">B & W</span>
        </div>
      </section>

      <!-- Adjustment Sliders -->
      <section class="card p-lg flex-col gap-md mb-xl">
        <div class="slider-row">
          <span class="material-icons-round text-secondary" style="font-size:20px;">brightness_6</span>
          <input type="range" id="brightnessRange" min="50" max="150" value="105" aria-label="Brightness" />
        </div>
        <div class="slider-row">
          <span class="material-icons-round text-secondary" style="font-size:20px;">contrast</span>
          <input type="range" id="contrastRange" min="50" max="150" value="125" aria-label="Contrast" />
        </div>
      </section>

      <!-- Bottom Action Row -->
      <div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--screen-max);padding:16px var(--screen-pad);background:var(--bg);border-top:1px solid var(--border);box-shadow:0 -4px 16px rgba(0,0,0,0.06);z-index:90;display:flex;align-items:center;gap:12px;">
        <button class="btn btn-outlined btn-sm" id="addPageBtn" style="width:auto;min-width:100px;">
          <span class="material-icons-round">note_add</span>
          <span>Add Page</span>
        </button>
        <button class="btn btn-primary flex-1" id="continueAiBtn">
          <span>Continue with AI</span>
          <span class="material-icons-round">auto_awesome</span>
        </button>
      </div>

    </main>
  </div>

  <script src="../js/apiClient.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/navigation.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      StudyGenNav.initScrollBehavior();

      const pageBadge = document.getElementById('pageBadge');
      const prevPageBtn = document.getElementById('prevPageBtn');
      const nextPageBtn = document.getElementById('nextPageBtn');
      const realCapturedImage = document.getElementById('realCapturedImage');
      const scannedImageSim   = document.getElementById('scannedImageSim');

      let currentPageIndex = 0;
      let pagesData = [];
      let currentBlob = null;
      let currentDocTitle = 'Scanned Document';

      // Load batch pages array or single document blob from IndexedDB
      const batchStr = sessionStorage.getItem('sg_batch_pages');
      if (batchStr) {
        try {
          pagesData = JSON.parse(batchStr);
        } catch {}
      }

      const activeDocId = sessionStorage.getItem('sg_active_doc_id');
      if (activeDocId && window.LocalPdfDB) {
        try {
          const docRecord = await window.LocalPdfDB.getDocument(activeDocId);
          if (docRecord) {
            currentDocTitle = docRecord.documentTitle || 'Scanned Document';
            currentBlob = docRecord.blob;
            if (pagesData.length === 0 && docRecord.blob) {
              pagesData = [URL.createObjectURL(docRecord.blob)];
            }
          }
        } catch (err) {
          console.warn('Could not load doc blob:', err.message);
        }
      }

      function updateCarouselPage() {
        const total = Math.max(1, pagesData.length);
        if (pageBadge) pageBadge.textContent = `Page ${currentPageIndex + 1} of ${total}`;

        if (prevPageBtn) prevPageBtn.disabled = currentPageIndex <= 0;
        if (nextPageBtn) nextPageBtn.disabled = currentPageIndex >= total - 1;

        if (pagesData.length > 0 && realCapturedImage) {
          realCapturedImage.src = pagesData[currentPageIndex];
          realCapturedImage.style.display = 'block';
          if (scannedImageSim) scannedImageSim.style.display = 'none';
        }
      }

      updateCarouselPage();

      if (prevPageBtn) {
        prevPageBtn.addEventListener('click', () => {
          if (currentPageIndex > 0) {
            currentPageIndex--;
            updateCarouselPage();
          }
        });
      }

      if (nextPageBtn) {
        nextPageBtn.addEventListener('click', () => {
          if (currentPageIndex < pagesData.length - 1) {
            currentPageIndex++;
            updateCarouselPage();
          }
        });
      }

      // Filter chips interaction
      const chips = document.querySelectorAll('[data-filter]');
      chips.forEach(chip => {
        chip.addEventListener('click', () => {
          chips.forEach(c => c.classList.remove('active'));
          chip.classList.add('active');

          const filter = chip.getAttribute('data-filter');
          const target = realCapturedImage.style.display !== 'none' ? realCapturedImage : scannedImageSim;
          target.className = target === realCapturedImage ? 'filter-magic' : 'scanned-img-sim';

          if (filter === 'magic') target.classList.add('filter-magic');
          else if (filter === 'color') target.classList.add('filter-color');
          else if (filter === 'bw') target.classList.add('filter-bw');

          StudyGenApp.toast.show(`Filter applied: ${chip.textContent}`);
        });
      });

      // Brightness / Contrast sliders
      const brightnessRange = document.getElementById('brightnessRange');
      const contrastRange   = document.getElementById('contrastRange');

      function updateImageFilters() {
        const b = brightnessRange.value;
        const c = contrastRange.value;
        const target = realCapturedImage.style.display !== 'none' ? realCapturedImage : scannedImageSim;
        target.style.filter = `brightness(${b}%) contrast(${c}%)`;
      }

      if (brightnessRange) brightnessRange.addEventListener('input', updateImageFilters);
      if (contrastRange) contrastRange.addEventListener('input', updateImageFilters);

      // Add Page button
      const addPageBtn = document.getElementById('addPageBtn');
      if (addPageBtn) {
        addPageBtn.addEventListener('click', () => {
          window.location.href = 'scanner.html';
        });
      }

      // Continue with AI processing button
      const continueAiBtn = document.getElementById('continueAiBtn');
      if (continueAiBtn) {
        continueAiBtn.addEventListener('click', async () => {
          if (!currentBlob && pagesData.length === 0) {
            window.location.href = 'ai-study.html';
            return;
          }

          StudyGenApp.toast.show(`Analyzing ${pagesData.length || 1} scanned ${pagesData.length === 1 ? 'page' : 'pages'} with Gemini AI... ✨`, 6000);

          try {
            const formData = new FormData();
            if (currentBlob) {
              formData.append('file', currentBlob, `${currentDocTitle}.jpg`);
            } else if (pagesData.length > 0) {
              const fetchRes = await fetch(pagesData[0]);
              const blob = await fetchRes.blob();
              formData.append('file', blob, `${currentDocTitle}.jpg`);
            }

            const res = await window.ApiClient.uploadFile('/ai/study-notes', formData);
            if (res && res.success && res.data) {
              sessionStorage.setItem('sg_study_output', JSON.stringify({
                localPdfId: activeDocId,
                documentTitle: currentDocTitle,
                ...res.data,
              }));
              StudyGenApp.toast.show('AI Study Notes generated! Opening... 🚀');
              setTimeout(() => { window.location.href = 'ai-study.html'; }, 400);
            } else {
              window.location.href = 'ai-study.html';
            }
          } catch (err) {
            console.error('AI Study notes generation error:', err);
            window.location.href = 'ai-study.html';
          }
        });
      }

    });
  </script>
</body>
</html>
