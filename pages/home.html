<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Home — EasyScan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="screen screen--with-nav screen--with-bar">
    
    <!-- Top App Bar -->
    <header class="app-bar" id="appBar">
      <div class="app-bar__logo">
        <div class="app-bar__logo-icon">
          <span class="material-icons-round" style="font-size:20px;color:white">menu_book</span>
        </div>
        <span class="app-bar__title">EasyScan</span>
      </div>
      <div class="app-bar__actions">
        <button class="app-bar__action-btn" id="notifBtn" aria-label="Notifications">
          <span class="material-icons-round">notifications_none</span>
        </button>
        <div class="app-bar__avatar avatar-placeholder" id="avatarBtn" role="button" aria-label="Profile">
          ES
        </div>
      </div>
    </header>

    <!-- Scrollable Main Content -->
    <main class="page-scroll">
      
      <!-- Greeting Banner Card -->
      <section class="card-gradient p-xl mb-xl">
        <div class="flex-between">
          <div>
            <h2 class="text-headline-sm text-white" id="greetingText">Welcome to EasyScan! 👋</h2>
            <p class="text-body-sm text-white" style="opacity:0.85;margin-top:4px;">What would you like to study today?</p>
          </div>
          <div class="icon-container icon-container--lg" style="background:rgba(255,255,255,0.2);color:white;border-radius:18px;">
            <span class="material-icons-round" style="font-size:32px;">auto_awesome</span>
          </div>
        </div>
      </section>

      <!-- Main Action Card: Scan Document -->
      <section class="card card--elevated p-xl mb-xl flex-col items-center text-center gap-md" style="background:linear-gradient(180deg, var(--bg) 0%, var(--primary-light) 100%);border-color:rgba(59,123,248,0.2);">
        <div class="icon-container icon-container--lg ic-primary icon-container--circle" style="width:64px;height:64px;box-shadow:0 8px 24px rgba(59,123,248,0.25);">
          <span class="material-icons-round" style="font-size:32px;">document_scanner</span>
        </div>
        <div>
          <h3 class="text-headline-sm" style="color:var(--text-primary);">Scan Document</h3>
          <p class="text-body-sm text-secondary" style="margin-top:2px;">Scan your handwritten notes, textbooks or handouts</p>
        </div>
        <a href="scanner.html" class="btn btn-primary mt-xs" style="text-decoration:none;">
          <span class="material-icons-round">photo_camera</span>
          <span>Start Scanning</span>
        </a>
      </section>

      <!-- AI Study Start Button -->
      <section class="mb-xl">
        <a href="upload-ai.html" style="display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#f0f4ff,#e8edff);border:1.5px solid rgba(59,123,248,0.2);border-radius:16px;padding:16px 20px;text-decoration:none;transition:transform 0.15s,box-shadow 0.15s;" id="aiStudyStartBtn">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:40px;height:40px;background:linear-gradient(135deg,#3b7bf8,#7b52f4);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <span class="material-icons-round" style="color:white;font-size:20px;">auto_awesome</span>
            </div>
            <span style="font-size:15px;font-weight:600;color:#1a1a2e;">Let's start your study with AI</span>
          </div>
          <span class="material-icons-round" style="color:#3b7bf8;font-size:22px;">arrow_forward_ios</span>
        </a>
      </section>

      <!-- Recent Activity Section -->
      <section class="mb-xl">
        <div class="section-header">
          <h3 class="section-header__title">Recent Activity</h3>
          <a href="history.html" class="section-header__link">See All</a>
        </div>
        <div class="flex-col gap-sm" id="recentActivityList">
          <!-- Skeleton loading state -->
          <div id="recentActivitySkeleton" style="display:flex;flex-direction:column;gap:10px;">
            <div style="height:60px;background:linear-gradient(90deg,#f0f0f0 25%,#e8e8e8 50%,#f0f0f0 75%);background-size:200% 100%;border-radius:12px;animation:shimmer 1.4s infinite;"></div>
            <div style="height:60px;background:linear-gradient(90deg,#f0f0f0 25%,#e8e8e8 50%,#f0f0f0 75%);background-size:200% 100%;border-radius:12px;animation:shimmer 1.4s infinite 0.2s;"></div>
          </div>
        </div>
        <style>@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}</style>
      </section>

    </main>

  </div>

  <script src="../js/apiClient.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/navigation.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      StudyGenNav.init({ activePage: 'home', requireAuth: false });

      const activityList = document.getElementById('recentActivityList');

      function formatSize(bytes) {
        if (!bytes) return '';
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      }

      function relTime(iso) {
        if (!iso) return '';
        const diff = Date.now() - new Date(iso).getTime();
        const mins = Math.floor(diff / 60000);
        if (mins < 1)   return 'Just now';
        if (mins < 60)  return `${mins} min ago`;
        const hrs = Math.floor(mins / 60);
        if (hrs < 24)   return `${hrs} hr ago`;
        const days = Math.floor(hrs / 24);
        if (days === 1) return 'Yesterday';
        return `${days} days ago`;
      }

      async function loadRecentDocuments() {
        if (!activityList) return;

        try {
          let docs = [];
          if (window.LocalPdfDB) {
            docs = await window.LocalPdfDB.getRecentDocuments(5);
          }

          if (!docs || docs.length === 0) {
            activityList.innerHTML = `
              <div style="text-align:center;padding:28px 16px;color:var(--text-secondary);background:var(--surface);border-radius:16px;border:1px dashed var(--border);">
                <span class="material-icons-round" style="font-size:38px;opacity:0.3;display:block;margin-bottom:6px;">history</span>
                <p style="font-size:14px;font-weight:700;margin:0 0 4px;color:var(--text-primary);">No recent documents yet</p>
                <p style="font-size:12px;opacity:0.8;margin:0;">Documents you open or scan will appear here.</p>
              </div>`;
            return;
          }

          activityList.innerHTML = docs.map(doc => {
            const title = doc.documentTitle || doc.filename || 'Untitled Document';
            const timeStr = relTime(doc.lastOpenedAt || doc.updatedAt || doc.createdAt);
            const sizeStr = formatSize(doc.sizeBytes);
            const pagesStr = doc.pageCount ? `${doc.pageCount} ${doc.pageCount === 1 ? 'page' : 'pages'}` : 'PDF';
            const metaInfo = [pagesStr, sizeStr, timeStr].filter(Boolean).join(' • ');

            const thumbHtml = (doc.thumbnail && (doc.thumbnail.startsWith('data:image') || doc.thumbnail.startsWith('http')))
              ? `<img src="${doc.thumbnail}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;" alt="Preview" onerror="this.style.display='none';this.parentElement.innerHTML='<span class=\\'material-icons-round\\'>picture_as_pdf</span>';" />`
              : `<span class="material-icons-round">picture_as_pdf</span>`;

            return `
              <div class="list-item doc-item-row" data-id="${doc.localPdfId}" style="cursor:pointer;">
                <div class="icon-container ic-pdf" style="overflow:hidden;">
                  ${thumbHtml}
                </div>
                <div class="list-item__content">
                  <div class="list-item__title">${title} ${doc.isFavorite ? '⭐' : ''}</div>
                  <div class="list-item__subtitle">${metaInfo}</div>
                </div>
                <span class="material-icons-round list-item__trailing">chevron_right</span>
              </div>`;
          }).join('');

          // Click listener for recent items
          activityList.querySelectorAll('.doc-item-row').forEach(row => {
            row.addEventListener('click', async () => {
              const id = row.getAttribute('data-id');
              if (id && window.LocalPdfDB) {
                await window.LocalPdfDB.touchLastOpened(id);
                sessionStorage.setItem('sg_active_doc_id', id);
                window.location.href = `pdf-ai.html`;
              }
            });
          });
        } catch (err) {
          console.warn('Recent documents load warning:', err.message);
        }
      }

      await loadRecentDocuments();

      // Real-time UI Sync listener (Requirement 7)
      window.addEventListener('studygen:doc-changed', () => {
        loadRecentDocuments();
      });
    });
  </script>
</body>
</html>
