<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PDF Document Viewer — StudyGen AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <style>
    .scanned-pdf-card {
      background: #181825;
      color: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: var(--sp-xl);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .pdf-page-frame {
      position: relative;
      width: 100%;
      max-width: 320px;
      background: white;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      margin: 0 auto;
    }

    .pdf-page-frame img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .pdf-page-num-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0,0,0,0.7);
      color: white;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
    }
  </style>
  <!-- jsPDF Client-Side PDF Generation Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="screen screen--with-bar" style="padding-bottom:30px;">
    
    <!-- Top App Bar -->
    <header class="app-bar">
      <button class="app-bar__back" onclick="location.href='home.html'" aria-label="Back">
        <span class="material-icons-round">arrow_back_ios_new</span>
      </button>
      <span class="app-bar__center">PDF Document Viewer</span>
      <div class="app-bar__actions">
        <div class="app-bar__avatar avatar-placeholder" style="width:34px;height:34px;font-size:13px;">SG</div>
      </div>
    </header>

    <!-- Main Scroll Content -->
    <main class="page-scroll page-scroll--no-nav">
      
      <!-- Active Compiled Scanned PDF Viewer Card -->
      <section class="scanned-pdf-card" id="scannedPdfCard" style="display:block;">
        <div class="flex-between mb-md">
          <div class="flex-center gap-md">
            <span class="material-icons-round" style="color:#ef4444;font-size:32px;">picture_as_pdf</span>
            <div>
              <h3 class="text-subtitle-md font-bold" id="scannedPdfTitle" style="color:white;margin:0;">Scanned_Document.pdf</h3>
              <span class="text-caption text-secondary" id="scannedPdfMeta" style="color:#94a3b8;">2 Pages &bull; Ready</span>
            </div>
          </div>
          <span class="badge" style="background:#22c55e;color:white;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;">PDF Ready ✨</span>
        </div>

        <!-- Scrollable Multi-Page PDF Stack View -->
        <div id="scannedPdfPagesContainer" style="max-height:420px;overflow-y:auto;background:#0f0f18;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:16px;">
          <!-- Generated PDF pages rendered dynamically via JS -->
        </div>

        <!-- Action Buttons Group -->
        <div style="margin-top:20px;display:flex;flex-direction:column;gap:10px;">
          <button class="btn btn-primary btn-md" id="studyWithAiBtn" style="width:100%;background:linear-gradient(135deg, #7b52f4, #3b7bf8);border:none;border-radius:12px;font-weight:700;font-size:15px;padding:14px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 20px rgba(123,82,244,0.35);color:white;cursor:pointer;">
            <span class="material-icons-round" style="font-size:22px;">auto_awesome</span>
            <span>Study with AI (Summary, Quiz, Flashcards) ✨</span>
          </button>

          <button class="btn btn-primary btn-md" id="cardSaveDeviceBtn" style="width:100%;background:linear-gradient(135deg, #2563eb, #1d4ed8);border:none;border-radius:12px;font-weight:700;font-size:16px;padding:14px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 20px rgba(37,99,235,0.4);">
            <span class="material-icons-round" style="font-size:24px;">download</span>
            <span>Save PDF to Device 💾</span>
          </button>

          <button class="btn btn-outlined btn-sm" id="pdfViewBtn" style="width:100%;color:white;border-color:rgba(255,255,255,0.3);border-radius:10px;padding:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;background:rgba(255,255,255,0.06);">
            <span class="material-icons-round" style="font-size:20px;color:#3b7bf8;">visibility</span>
            <span>View as PDF</span>
          </button>
          
          <button class="btn btn-outlined btn-sm" id="pdfRenameBtn" style="width:100%;color:white;border-color:rgba(255,255,255,0.25);border-radius:10px;padding:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;background:rgba(255,255,255,0.04);">
            <span class="material-icons-round" style="font-size:18px;color:#f59e0b;">edit</span>
            <span>Rename Document</span>
          </button>

          <button class="btn btn-outlined btn-sm" id="pdfShareBtn" style="width:100%;color:white;border-color:rgba(255,255,255,0.2);border-radius:10px;padding:10px;display:flex;align-items:center;justify-content:center;gap:8px;">
            <span class="material-icons-round" style="font-size:18px;">share</span>
            <span>Share Document</span>
          </button>

          <button class="btn btn-outlined btn-sm" id="pdfDeleteBtn" style="width:100%;color:#ef4444;border-color:rgba(239,68,68,0.4);border-radius:10px;padding:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;background:rgba(239,68,68,0.06);">
            <span class="material-icons-round" style="font-size:18px;color:#ef4444;">delete_outline</span>
            <span>Delete Document</span>
          </button>
        </div>
      </section>

    </main>
  </div>

  <script src="../js/apiClient.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/pdf-ai.js"></script>
</body>
</html>
